<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Desktop Workstation Frame & Header -->
  <rect x="0" y="0" width="1440" height="900" fill="#f8fafc" />
  <rect x="0" y="0" width="1440" height="68" fill="#0f172a" />
  
  <text x="32" y="42" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1">CLINSYNC</text>
  <rect x="145" y="22" width="180" height="26" rx="4" fill="#0d9488" opacity="0.25" />
  <text x="153" y="40" fill="#5eead4" font-size="12" font-family="monospace">DOCTOR WORKSTATION</text>

  <text x="1220" y="42" fill="#94a3b8" font-size="14">Dr. Sarah Jenkins, MD • <tspan fill="#5eead4">On Duty</tspan></text>

  <!-- Left Sidebar: Triage Patient Queue (380px wide) -->
  <rect x="24" y="88" width="360" height="788" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="48" y="124" fill="#0f172a" font-size="18" font-weight="800">Triage Intake Queue</text>
  <text x="48" y="146" fill="#64748b" font-size="13">Sorted by Acuity &amp; Arrival Time</text>

  <!-- Patient Queue Card 1 (Selected) -->
  <rect x="40" y="168" width="328" height="110" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
  <rect x="56" y="184" width="70" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="64" y="198" fill="#b91c1c" font-size="10" font-weight="bold">URGENT</text>
  <text x="56" y="224" fill="#0f172a" font-size="16" font-weight="700">Eleanor Johnson, 68F</text>
  <text x="56" y="246" fill="#64748b" font-size="13">Tension headache + Warfarin Discrepancy</text>
  <text x="56" y="266" fill="#0d9488" font-size="12" font-weight="600">Arrived 10:15 AM • 10:30 AM Slot</text>

  <!-- Patient Queue Card 2 -->
  <rect x="40" y="290" width="328" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="56" y="306" width="70" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="64" y="320" fill="#15803d" font-size="10" font-weight="bold">ROUTINE</text>
  <text x="56" y="344" fill="#0f172a" font-size="15" font-weight="700">Arthur Pendelton, 54M</text>
  <text x="56" y="366" fill="#64748b" font-size="13">Routine Hypertension Follow-up</text>

  <!-- Patient Queue Card 3 -->
  <rect x="40" y="398" width="328" height="96" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="56" y="414" width="70" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
  <text x="64" y="428" fill="#15803d" font-size="10" font-weight="bold">ROUTINE</text>
  <text x="56" y="452" fill="#0f172a" font-size="15" font-weight="700">Maria Santos, 32F</text>
  <text x="56" y="474" fill="#64748b" font-size="13">Annual Health Screen</text>

  <!-- Main Center-Right Panel: Doctor Brief & Audio Player -->
  <rect x="404" y="88" width="1012" height="788" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Header with Patient Name & Actions -->
  <text x="436" y="128" fill="#0f172a" font-size="22" font-weight="800">Clinical Brief: Eleanor Johnson (DOB: 1958-03-14)</text>
  <text x="436" y="152" fill="#64748b" font-size="14">Intake Session #enc-8812 • Verified via DOB Check • Primary: Dr. Jenkins</text>

  <rect x="1200" y="108" width="186" height="46" rx="8" fill="#0d9488" />
  <text x="1228" y="137" fill="#ffffff" font-size="14" font-weight="700">✓ Sign &amp; Approve</text>

  <!-- Sourced Audio Player Bar -->
  <rect x="436" y="174" width="950" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="476" cy="216" r="22" fill="#0d9488" />
  <polygon points="472,206 486,216 472,226" fill="#ffffff" />
  
  <text x="516" y="206" fill="#0f172a" font-size="15" font-weight="700">60-Second Synthesized Doctor Audio Brief</text>
  <text x="516" y="228" fill="#64748b" font-size="12">Constrained to 100% Grounded Context Ledger Facts</text>

  <rect x="516" y="238" width="600" height="6" rx="3" fill="#e2e8f0" />
  <rect x="516" y="238" width="240" height="6" rx="3" fill="#0d9488" />
  <text x="1130" y="244" fill="#64748b" font-size="12">0:24 / 1:00</text>

  <!-- Chief Complaint & Narrative -->
  <text x="436" y="296" fill="#0f172a" font-size="16" font-weight="800">1. Chief Complaint &amp; Intake Synthesis</text>
  <rect x="436" y="310" width="950" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="456" y="338" fill="#0f172a" font-size="14" font-weight="600">Patient presents with a 3-day history of bilateral tension headache, exacerbated by screen time.</text>
  <text x="456" y="362" fill="#334155" font-size="13">Denies chest pain, shortness of breath, or focal neurological deficits <tspan fill="#0d9488" font-weight="bold">[Citation #C1: Kiosk Turn 2]</tspan>.</text>
  <text x="456" y="384" fill="#334155" font-size="13">Mentions mild postural lightheadedness without syncope <tspan fill="#0d9488" font-weight="bold">[Citation #C2: Kiosk Turn 3]</tspan>.</text>

  <!-- Medication & Conflict Reconciler -->
  <text x="436" y="432" fill="#0f172a" font-size="16" font-weight="800">2. Active Medications &amp; Critical Reconciliation</text>
  <rect x="436" y="446" width="950" height="120" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" />
  <rect x="456" y="462" width="130" height="22" rx="4" fill="#e11d48" />
  <text x="466" y="477" fill="#ffffff" font-size="11" font-weight="bold">⚠ CONFLICT ALERT</text>
  <text x="456" y="508" fill="#9f1239" font-size="15" font-weight="700">Warfarin Dosage Discrepancy:</text>
  <text x="456" y="532" fill="#334155" font-size="13">Patient stated current dosage is 5 mg daily <tspan fill="#0d9488" font-weight="bold">[C3: Kiosk Intake]</tspan>, whereas 2024 EHR record shows 2.5 mg daily <tspan fill="#0d9488" font-weight="bold">[C4: EHR 2024]</tspan>.</text>
  <text x="456" y="554" fill="#b91c1c" font-size="13" font-weight="600">Action: Confirm current INR test and reconcile anticoagulant dose with patient prior to discharge.</text>

  <!-- Relevant Prior History & Labs -->
  <text x="436" y="596" fill="#0f172a" font-size="16" font-weight="800">3. Diagnostic Findings &amp; Allergies</text>
  <rect x="436" y="610" width="460" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="456" y="638" fill="#0f172a" font-size="14" font-weight="700">Recent Lab Extraction (blood_panel_q3.pdf):</text>
  <text x="456" y="662" fill="#334155" font-size="13">• Fasting Glucose: 118 mg/dL (Pre-diabetic range) <tspan fill="#0d9488">[C5: Page 1]</tspan></text>
  <text x="456" y="684" fill="#334155" font-size="13">• Total Cholesterol: 242 mg/dL (Elevated) <tspan fill="#0d9488">[C6: Page 1]</tspan></text>

  <rect x="916" y="610" width="470" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="936" y="638" fill="#0f172a" font-size="14" font-weight="700">Allergies &amp; Safety Warnings:</text>
  <text x="936" y="662" fill="#b91c1c" font-size="13" font-weight="700">⚠ Penicillin: Anaphylaxis (Historical 2019) <tspan fill="#0d9488">[C7]</tspan></text>
  <text x="936" y="684" fill="#334155" font-size="13">No other recorded drug allergies.</text>

  <!-- Bottom Workstation Status -->
  <rect x="436" y="756" width="950" height="56" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
  <text x="456" y="790" fill="#0d9488" font-size="13" font-weight="700">Grounding Verifier: 100% of facts cite validated Context Ledger IDs. 0 hallucinated claims.</text>
</svg>
