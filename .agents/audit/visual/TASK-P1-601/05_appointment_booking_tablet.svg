<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Tablet Frame & Header -->
  <rect x="0" y="0" width="1024" height="768" fill="#f8fafc" />
  <rect x="0" y="0" width="1024" height="72" fill="#0f172a" />
  
  <text x="32" y="44" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1">CLINSYNC</text>
  <rect x="145" y="24" width="220" height="26" rx="4" fill="#0d9488" opacity="0.25" />
  <text x="153" y="42" fill="#5eead4" font-size="12" font-family="monospace">APPOINTMENT SCHEDULING</text>

  <!-- Step Progress Indicator -->
  <rect x="48" y="92" width="928" height="32" fill="none" />
  <text x="48" y="114" fill="#0f172a" font-size="16" font-weight="700">Step 4 of 4: Select Consultation Time</text>
  <rect x="648" y="102" width="328" height="12" rx="6" fill="#e2e8f0" />
  <rect x="648" y="102" width="328" height="12" rx="6" fill="#0d9488" />

  <!-- Main Container -->
  <rect x="48" y="140" width="928" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Department Tabs (Min-h 48px touch targets) -->
  <text x="80" y="180" fill="#0f172a" font-size="16" font-weight="700">Select Specialty Department:</text>
  <rect x="80" y="196" width="240" height="52" rx="8" fill="#0d9488" />
  <text x="110" y="228" fill="#ffffff" font-size="15" font-weight="700">General Internal Med</text>

  <rect x="336" y="196" width="200" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="380" y="228" fill="#475569" font-size="15" font-weight="600">Cardiology</text>

  <rect x="552" y="196" width="200" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="600" y="228" fill="#475569" font-size="15" font-weight="600">Neurology</text>

  <!-- Slot Selection Cards (Touch targets >= 96px) -->
  <text x="80" y="286" fill="#0f172a" font-size="16" font-weight="700">Available Slots for Today (Oct 18, 2026):</text>
  
  <!-- Slot Card 1 (Selected) -->
  <rect x="80" y="306" width="270" height="106" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5" />
  <circle cx="110" cy="336" r="10" fill="#0d9488" />
  <circle cx="110" cy="336" r="4" fill="#ffffff" />
  <text x="134" y="342" fill="#0f172a" font-size="18" font-weight="800">10:30 AM</text>
  <text x="110" y="372" fill="#0d9488" font-size="14" font-weight="600">Dr. Sarah Jenkins, MD</text>
  <text x="110" y="394" fill="#64748b" font-size="12">Room 402 • 30 mins</text>

  <!-- Slot Card 2 -->
  <rect x="370" y="306" width="270" height="106" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="400" cy="336" r="10" fill="none" stroke="#94a3b8" stroke-width="2" />
  <text x="424" y="342" fill="#0f172a" font-size="18" font-weight="800">11:15 AM</text>
  <text x="400" y="372" fill="#475569" font-size="14" font-weight="600">Dr. Sarah Jenkins, MD</text>
  <text x="400" y="394" fill="#64748b" font-size="12">Room 402 • 30 mins</text>

  <!-- Slot Card 3 -->
  <rect x="660" y="306" width="270" height="106" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="690" cy="336" r="10" fill="none" stroke="#94a3b8" stroke-width="2" />
  <text x="714" y="342" fill="#0f172a" font-size="18" font-weight="800">02:00 PM</text>
  <text x="690" y="372" fill="#475569" font-size="14" font-weight="600">Dr. Robert Chen, MD</text>
  <text x="690" y="394" fill="#64748b" font-size="12">Room 308 • 30 mins</text>

  <!-- Atomic Booking Guarantee Banner -->
  <rect x="80" y="440" width="850" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="108" y="470" fill="#0f172a" font-size="14" font-weight="700">Atomic Booking Safeguard:</text>
  <text x="108" y="492" fill="#64748b" font-size="13">Slots are secured via database row-level locking. If a concurrent collision occurs, alternatives are immediately displayed.</text>

  <!-- Book Slot Action CTA -->
  <rect x="80" y="540" width="850" height="60" rx="10" fill="#0d9488" />
  <text x="360" y="578" fill="#ffffff" font-size="18" font-weight="700">Confirm Appointment for 10:30 AM ›</text>

  <!-- Bottom Accessibility Status -->
  <rect x="0" y="700" width="1024" height="68" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="48" y="740" fill="#64748b" font-size="14">Touch Target: <tspan fill="#0d9488" font-weight="bold">106px Height (Exceeds WCAG 48px baseline by 120%)</tspan></text>
</svg>
