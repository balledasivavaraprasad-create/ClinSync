<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Tablet Frame & Header -->
  <rect x="0" y="0" width="1024" height="768" fill="#f8fafc" />
  <rect x="0" y="0" width="1024" height="72" fill="#0f172a" />
  
  <text x="32" y="44" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1">CLINSYNC</text>
  <rect x="145" y="24" width="130" height="26" rx="4" fill="#0d9488" opacity="0.25" />
  <text x="153" y="42" fill="#5eead4" font-size="12" font-family="monospace">PATIENT KIOSK</text>
  
  <!-- Accessibility & Language Selectors (>=48px touch target) -->
  <rect x="620" y="14" width="48" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="635" y="41" fill="#ffffff" font-size="14" font-weight="600">EN</text>
  <rect x="676" y="14" width="48" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="691" y="41" fill="#94a3b8" font-size="14" font-weight="600">ES</text>
  <rect x="732" y="14" width="48" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="747" y="41" fill="#94a3b8" font-size="14" font-weight="600">ZH</text>

  <!-- High Contrast Mode Toggle -->
  <rect x="796" y="14" width="196" height="44" rx="6" fill="#1e293b" stroke="#0d9488" stroke-width="1.5" />
  <circle cx="818" cy="36" r="8" fill="#5eead4" />
  <text x="836" y="41" fill="#5eead4" font-size="13" font-weight="600">High Contrast: OFF</text>

  <!-- Emergency Override Banner -->
  <rect x="48" y="96" width="928" height="54" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
  <circle cx="76" cy="123" r="12" fill="#ef4444" />
  <text x="72" y="128" fill="#ffffff" font-size="14" font-weight="bold">!</text>
  <text x="100" y="128" fill="#991b1b" font-size="14" font-weight="600">EXPERIENCING CHEST PAIN OR SEVERE BREATHING DIFFICULTY? Please immediately alert clinic reception or call 911.</text>

  <!-- Main Welcome Card -->
  <rect x="48" y="174" width="928" height="480" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <text x="96" y="240" fill="#0f172a" font-size="32" font-weight="800">Welcome to ClinSync Health Center</text>
  <text x="96" y="274" fill="#64748b" font-size="16">Self-service digital check-in, adaptive clinical intake, and automated consultation prep.</text>
  
  <!-- Card 1: Returning Patient (Min-h 80px touch target) -->
  <rect x="96" y="318" width="736" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
  <circle cx="146" cy="368" r="24" fill="#ccfbf1" />
  <text x="138" y="375" fill="#0d9488" font-size="20">✓</text>
  <text x="190" y="356" fill="#0f172a" font-size="18" font-weight="700">Returning Patient Check-In</text>
  <text x="190" y="384" fill="#64748b" font-size="14">Verify your appointment, update symptoms, or upload recent diagnostic documents.</text>
  <rect x="856" y="342" width="76" height="52" rx="8" fill="#0d9488" />
  <text x="876" y="374" fill="#ffffff" font-size="15" font-weight="700">Start ›</text>

  <!-- Card 2: New Patient Registration (Min-h 80px touch target) -->
  <rect x="96" y="438" width="736" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="146" cy="488" r="24" fill="#f1f5f9" />
  <text x="138" y="495" fill="#475569" font-size="20">+</text>
  <text x="190" y="476" fill="#0f172a" font-size="18" font-weight="700">New Patient / First-Time Registration</text>
  <text x="190" y="504" fill="#64748b" font-size="14">Create your clinical profile, review HIPAA privacy disclosures, and initiate triage intake.</text>
  <rect x="856" y="462" width="76" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="874" y="494" fill="#475569" font-size="15" font-weight="700">Begin ›</text>

  <!-- Privacy & HIPAA Notice -->
  <rect x="96" y="566" width="836" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="120" y="601" fill="#64748b" font-size="13">🔒 Privacy Protected: Your medical context is protected under HIPAA standards. Information is encrypted end-to-end.</text>

  <!-- Bottom Touch Status Bar -->
  <rect x="0" y="700" width="1024" height="68" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="48" y="740" fill="#64748b" font-size="14">Touch Target: <tspan fill="#0d9488" font-weight="bold">WCAG AAA (≥ 48px compliant)</tspan></text>
  <text x="780" y="740" fill="#64748b" font-size="14">Need Assistance? <tspan fill="#0d9488" font-weight="bold">Call Staff (F1)</tspan></text>
</svg>
