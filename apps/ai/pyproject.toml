[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinsync-ai"
version = "0.1.0"
description = "ClinSync Agentic AI, Model Gateway, Tracing, Guardrails, and Evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.1",
    "groq>=0.9.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clinsync_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
